<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion Finance — Hors ligne</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --fg: #1a1a2e;
        --muted: #6b7280;
        --primary: oklch(0.56 0.25 285);
        --border: rgba(0,0,0,0.09);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.09 0.012 265);
          --card: oklch(0.13 0.012 265);
          --fg: oklch(0.94 0 0);
          --muted: oklch(0.52 0.008 265);
          --border: rgba(255,255,255,0.07);
        }
      }

      body {
        font-family: -apple-system, "Geist", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 380px;
        width: 100%;
        text-align: center;
      }

      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, oklch(0.56 0.25 285), oklch(0.46 0.25 295));
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }

      .icon svg { width: 28px; height: 28px; }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      p {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.25rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        background: linear-gradient(180deg, oklch(0.56 0.25 285), oklch(0.46 0.25 295));
        color: #fff;
        transition: opacity 0.15s;
      }
      button:hover { opacity: 0.88; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg fill="none" viewBox="0 0 32 32">
          <rect class="r1" height="10" rx="1.5" width="4" x="5" y="18" fill="rgba(255,255,255,0.5)" />
          <rect height="18" rx="1.5" width="4" x="11" y="10" fill="rgba(255,255,255,0.7)" />
          <rect height="14" rx="1.5" width="4" x="17" y="14" fill="rgba(255,255,255,0.5)" />
          <rect height="22" rx="1.5" width="4" x="23" y="6" fill="white" />
        </svg>
      </div>

      <div class="badge">
        <span class="dot"></span>
        Connexion perdue
      </div>

      <h1>Motion Finance est hors ligne</h1>
      <p>Vérifiez votre connexion internet puis réessayez. Vos données locales sont intactes.</p>

      <button onclick="location.reload()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Réessayer
      </button>
    </div>
  </body>
</html>
